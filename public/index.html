<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .btn { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .on { background: #22c55e; color: #fff; } .off { background: #ef4444; color: #fff; }
        .player { display: flex; align-items: center; background: #334155; padding: 10px; border-radius: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ZarVerse Controls</h2>
        <button id="espBtn" class="btn" onclick="toggle('esp')">ESP</button>
        <button id="perfBtn" class="btn" onclick="toggle('perf')">Performance</button>
    </div>
    <div class="card">
        <h2>Live Active Players</h2>
        <div id="players"></div>
    </div>
    <script>
        async function update() {
            const data = await (await fetch('/api?action=get-settings')).json();
            document.getElementById('espBtn').className = 'btn ' + (data.autoEsp ? 'on' : 'off');
            document.getElementById('perfBtn').className = 'btn ' + (data.performanceMode ? 'on' : 'off');
            
            const players = await (await fetch('/api?action=get-players')).json();
            document.getElementById('players').innerHTML = players.map(p => `
                <div class="player"><img src="${p.avatarUrl}" width="40" style="border-radius:50%; margin-right:10px;">
                <div><b>${p.username}</b><br><small>${p.gameName}</small></div></div>`).join('');
        }
        async function toggle(a) { await fetch(`/api?action=toggle-${a}`); update(); }
        setInterval(update, 2000); update();
    </script>
</body>
</html>
