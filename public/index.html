<!-- Tambahkan di bawah Panel Control Roblox -->
<div class="card">
  <h2>Performance Mode</h2>
  <p>Status Vulkan/Perf: <strong id="perfStatus">OFF</strong></p>
  <button id="perfBtn" class="btn btn-off" onclick="togglePerf()">Turn ON Performance</button>
</div>

<script>
  // Tambahkan fungsi fetch/update
  async function togglePerf() {
    await fetch('/api?action=toggle-perf');
    updateDashboard();
  }

  // Update di dalam fungsi updateDashboard():
  const perfBtn = document.getElementById('perfBtn');
  const perfStatus = document.getElementById('perfStatus');
  
  if(dataSettings.performanceMode) {
    perfStatus.innerText = 'ON';
    perfBtn.innerText = 'Turn OFF Performance';
    perfBtn.className = 'btn';
  } else {
    perfStatus.innerText = 'OFF';
    perfBtn.className = 'btn btn-off';
  }
</script>
